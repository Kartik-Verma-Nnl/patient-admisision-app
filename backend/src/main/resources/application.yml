server:
  port: ${PORT:8080}
  shutdown: graceful
  # Correct scheme/host in Location headers when running behind a proxy (Render, Railway, etc.)
  forward-headers-strategy: framework

spring:
  application:
    name: patient-admission-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/patientdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}          # no default on purpose: must come from the environment
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}    # creates/updates the schema on startup

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Password / full URL come from env: SPRING_DATA_REDIS_PASSWORD or SPRING_DATA_REDIS_URL
      timeout: 2s
      connect-timeout: 2s

  cache:
    type: redis
    redis:
      time-to-live: ${CACHE_TTL_MINUTES:10}m
      use-key-prefix: true
      key-prefix: "patientapp::"
      cache-null-values: false

  jackson:
    deserialization:
      accept-float-as-int: false      # age=25.5 is rejected instead of silently becoming 25

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      enabled: false                  # app keeps working without Redis, so don't fail health because of it
